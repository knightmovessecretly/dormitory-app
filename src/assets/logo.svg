<svg width="1200" height="500" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Brush Script MT', cursive;
      font-size: 85px;
      fill: #ff4fa3;
    }
    .subtitle {
      font-family: 'Arial Black', sans-serif;
      font-size: 28px;
      fill: #0073c6;
    }
    .tagline {
      font-family: 'Segoe Script', cursive;
      font-size: 24px;
      fill: #272d2c;
      opacity: 0;
      animation: slideIn 3s ease-in-out infinite;
    }
    @keyframes slideIn {
      0% {
        transform: translateX(100px);
        opacity: 0;
      }
      50% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-100px);
        opacity: 0;
      }
    }
  </style>

  <!-- Curved Dormitoryana -->
  <path id="curve" d="M40,130 C200,0 400,0 560,130" fill="transparent"/>
  <text class="title">
    <textPath href="#curve" startOffset="0%">Dormitoryana</textPath>
  </text>

  <!-- SMRC aligned -->
  <text x="275" y="95" class="subtitle">SMRC</text>

  <!-- Animated tagline -->
  <text x="110" y="160" class="tagline">Your Home Away From Home!</text>
</svg>

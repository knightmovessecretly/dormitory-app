<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Brush Script MT', cursive;
      font-size: 60px;
      fill: #ff4fa3;
    }
    .subtitle {
      font-family: 'Arial Black', sans-serif;
      font-size: 40px;
      fill: #0073c6;
    }
    .tagline {
      font-family: 'Segoe Script', cursive;
      font-size: 24px;
      fill: #004b8d;
      opacity: 0;
      animation: slideIn 3s ease-in-out infinite;
    }
    @keyframes slideIn {
      0% {
        transform: translateX(100px);
        opacity: 0;
      }
      50% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-100px);
        opacity: 0;
      }
    }
  </style>

  <!-- Curved Dormitoryana -->
  <path id="curve" d="M50,120 C200,20 400,20 550,120" fill="transparent"/>
  <text class="title">
    <textPath href="#curve" startOffset="0%">Dormitoryana</textPath>
  </text>

  <!-- SMRC aligned -->
  <text x="180" y="100" class="subtitle">SMRC</text>

  <!-- Animated tagline -->
  <text x="110" y="160" class="tagline">Your Home Away From Home!</text>
</svg>

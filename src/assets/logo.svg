<svg width="1200" height="500" viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Brush Script MT', cursive;
      font-size: 85px;
      fill: #ff4fa3;
    }

    .subtitle {
      font-family: 'Arial Black', sans-serif;
      font-size: 28px;
      fill: #0073c6;
    }

    .tagline {
      font-family: 'Segoe Script', cursive;
      font-size: 18px;
      fill: #272d2c;
      opacity: 0;
      animation: slideIn 3s ease-in-out infinite;
    }

    @keyframes slideIn {
      0% {
        transform: translateX(-100px);
        opacity: 0;
      }

      50% {
        transform: translateX(0);
        opacity: 1;
      }

      100% {
        transform: translateX(-100px);
        opacity: 0;
      }
    }
  </style>

  <!-- Reduced left spacing -->
  <path id="curve" d="M10,130 C130,15 300,15 420,130" fill="transparent"/>

  <text class="title">
    <textPath href="#curve" startOffset="0%">Dormitoryana</textPath>
  </text>

  <text x="275" y="110" class="subtitle">SMRC</text>

  <text x="100" y="160" class="tagline">
    Your Home Away From Home!
  </text>
</svg>
